<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LaPierre Trails">
    <link rel="icon" href="https://www.windingtrails.org/images/favicon.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Icon for iOS home screen -->
    <link rel="apple-touch-icon" href="https://www.windingtrails.org/images/favicon.png">
    <title>Winding Trails | Map</title>
    <link rel="stylesheet" href="src/leaflet.css" />
    <link rel="stylesheet" href="src/leaflet.label.css" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100vw;
            /* 100% of viewport width */
            transition: transform 0.3s;
            /* Smooth transition for rotation */
            z-index: 1;
            margin: 0;
            /* Remove default margin */
        }

        .poiLabel {
            background: none;
            border: none;
            color: black;
            /* Adjust text color if needed */
            white-space: nowrap;
            box-shadow: none;
            text-align: center;
        }

        button {
            border-radius: 10px;
            border: none;
            transition: 0.5s ease transform;
        }

        button:hover {
            transform: scale(1.05);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: url('assets/target.svg');
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #306543;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #306543;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        /* Rounded sliders */
        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            content: url('assets/target.svg');
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div id="toosmallwarn"
        style="position: fixed; top: 0; left: 0; padding: 10px; display: none; align-items: center; justify-content: center; width: 100%; height: 100%; background-color: white; color: black; z-index: 99;">

    </div>

    </div>

         ">
        <div style="display: flex; flex-direction: row; width: 100%; height: 50px; margin-top: 10px;" >
            <input type="text" placeholder="Search" style="flex: 1;
                border-radius: 10px;
                height: 60%;
                text-align: center;
                border-top-color: white;

                border: solid 2.5px #306543;

            <button style="aspect-ratio: 1 / 1; height: 74%; cursor: pointer;">

                    <path
                        d="M14.9536 14.9458L21 21M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"
                        stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </button>
            <div style="width: 30px;"></div>
            <div style="text-align: center;">

                    <input id="FollowToggle" type="checkbox" checked>

                </label>
            </div>
            <button style="aspect-ratio: 1 / 1; height: 74%; margin-left: 5px; cursor: pointer; margin-right: 5px;">

                </svg>

        <div style="width: 100%; height: 45px; margin: 0; display: flex; align-items: center; justify-content: center;">
