<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LaPierre Trails">
    <link rel="icon" href="https://www.windingtrails.org/images/favicon.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Icon for iOS home screen -->
    <link rel="apple-touch-icon" href="https://www.windingtrails.org/images/favicon.png">
    <title>Winding Trails | Install App</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <h1>Winding Trails</h1>
    <p>We detected you are on an iPhone or iPad!</p>
    <p>To install as an app:</p>
    <ol>
        <li>Press the <strong>Share</strong> button at the bottom of your browser.</li>
        <li>Press <strong>"Add to Home Screen"</strong>.</li>
        <li>Press <strong>"Add"</strong> to confirm.</li>
    </ol>
    <br>
    <a href="map.html">Open map without installing</a>

    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        const isStandalone = window.navigator.standalone === true;

        // If running as installed app, go straight to map
        if (isStandalone) {
            window.location.replace('map.html');
        } else if (!isIOS && !isIPadOS) {
            // Not iOS at all, also go to map
            window.location.replace('map.html');
        }
    </script>
</body>

</html>
