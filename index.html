<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winding Trails | Install App</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <h1>Winding Trails</h1>
    <p>We detected you are on an iPhone or iPad!</p>
    <p>To install as an app:</p>
    <ol>
        <li>Press the <strong>Share</strong> button at the bottom of your browser.</li>
        <li>Press <strong>"Add to Home Screen"</strong>.</li>
        <li>Press <strong>"Add"</strong> to confirm.</li>
    </ol>
    <br>
    <a href="map.html">Open map without installing</a>

    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;

        if (!isIOS && !isIPadOS) {
            window.location.replace('map.html');
        }
    </script>
</body>

</html>
